name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify sources
        run: |
          python -m compileall -q main.py app
          python -m json.tool docs/extension-shop-firebase.json > $null

      - name: Run smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import addon_manager, settings_dialog, extension_shop; print('Milky imports OK')"

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Milky `
            --paths app `
            --icon assets/milka_idle.ico `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtNetwork `
            --add-data "assets;assets" `
            main.py

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Milky\* -DestinationPath dist\Milky-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milky-Windows
          path: dist/Milky-Windows.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Milky-Windows.zip
