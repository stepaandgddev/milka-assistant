name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify sources
        run: |
          python -m py_compile ai_client.py autostart.py clothing_art.py clothing_overlay.py drawing_skill.py image_service.py main.py outfit_store.py runtime.py screen_vision.py settings_dialog.py settings_store.py svg_art.py tts.py web_search.py

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Milky `
            --icon milka_idle.ico `
            --hidden-import PySide6.QtSvg `
            --add-data "gifs;gifs" `
            --add-data "milka_idle.svg;." `
            main.py

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Milky\* -DestinationPath dist\Milky-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milky-Windows
          path: dist/Milky-Windows.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Milky-Windows.zip
